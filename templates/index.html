<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyGenie AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 18px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 13px 25px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .loading {
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📚 StudyGenie AI</h1>
        <p>Your personal AI-powered study assistant</p>
    </div>

    <div class="card">

        <textarea
            id="question"
            placeholder="Ask StudyGenie anything...&#10;&#10;Example: Explain photosynthesis like I'm 12 years old."
        ></textarea>

        <button onclick="askGemini()">
            ✨ Ask StudyGenie
        </button>

        <div id="result">
            Your AI answer will appear here.
        </div>

    </div>

</div>

<script>
async function askGemini() {

    const question = document.getElementById("question").value.trim();
    const result = document.getElementById("result");

    if (!question) {
        result.textContent = "Please enter a question first.";
        return;
    }

    result.innerHTML = '<span class="loading">🤔 StudyGenie is thinking...</span>';

    try {

        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        if (data.error) {
            result.textContent = "Error: " + data.error;
        } else {
            result.textContent = data.answer;
        }

    } catch (error) {
        result.textContent = "Something went wrong. Please try again.";
        console.error(error);
    }
}
</script>

</body>
</html>
